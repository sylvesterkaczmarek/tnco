name: Exact-source regression validation
on:
  push:
    branches: ['validation/ordered-frozenset-hash-20260928']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTEST_SEED: '20260928'
      PYTEST_XDIST_WORKER: 'master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/tnco
          ref: '858c5ca9551f03aee95c925be2c9fbe711c34027'
          path: work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev libgmp-dev libmpfr-dev
      - name: Build package and install test dependencies
        run: |
          python -m pip install "./work[testing]" pytest-cov ruff==0.16.1 yapf==0.43.0 isort==8.0.1 docformatter==1.7.8
      - name: Verify exact source and original-code controls
        run: python validation/verify.py work evidence
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
